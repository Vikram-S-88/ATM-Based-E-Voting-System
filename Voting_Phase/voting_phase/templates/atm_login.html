<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Login</title>
    <style>
        body {
            background-color: #eef2f5;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .login-card {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #3498db;
        }
        .header h1 {
            font-size: 24px;
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .header p {
            color: #7f8c8d;
            font-size: 14px;
            margin: 0;
        }
        
        .step-badge {
            background-color: #e3f2fd;
            color: #3498db;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .icon-wrapper {
            margin: 30px 0;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon {
            font-size: 60px;
            color: #3498db;
            animation: float 3s ease-in-out infinite;
        }
        
        .instructions {
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 16px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .error-box {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 25px;
            border: 1px solid #fecaca;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <h1>Identity Verification</h1>
            <p>Secure E-Voting System</p>
        </div>

        {% if error %}
            <div class="error-box">
                <span>⚠️</span> {{ error }}
            </div>
        {% endif %}

        <div class="icon-wrapper">
            <div class="icon">💳</div>
        </div>
        
        <p class="instructions">
            Please insert your <strong>ATM Card</strong> on the card reader to begin authentication.
        </p>

        <form action="/scan_rfid" method="POST">
            <button type="submit" class="btn">Scan Card</button>
        </form>
    </div>
</body>
</html>
