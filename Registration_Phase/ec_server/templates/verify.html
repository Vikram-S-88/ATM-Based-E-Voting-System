<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voter Identity Verification</title>
    <style>
        body {
            background-color: #eef2f5;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .ec-card {
            background: white;
            width: 450px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #e67e22; /* ECI Orange */
        }

        .header h1 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .info-box {
            background: #fdf2e9;
            border: 1px dashed #e67e22;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #d35400;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: left;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 13px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        .epic-input {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Captcha Section */
        .captcha-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .captcha-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .reload-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
        }
        .reload-btn:hover { background: #d0d0d0; }

        .btn-verify {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }

        .cancel-link {
            display: inline-block;
            margin-top: 25px;
            color: #95a5a6;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .cancel-link:hover { color: #e74c3c; }

        .error-msg {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 25px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="ec-card">
        <div class="header">
            <h1>🇮🇳 Election Commission</h1>
        </div>
        
        <div class="info-box">
            Please enter your <strong>Voter EPIC Number</strong>
        </div>

        {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/process_registration" method="POST">
            <input type="hidden" name="session_token" value="{{ token }}">
            
            <div class="input-group">
                <label>Voter EPIC Number</label>
                <input type="text" name="epic_id" class="epic-input" placeholder="Ex: ABC1234567" required>
            </div>

            <div class="captcha-container">
                <label style="margin-bottom: 10px;">Captcha Verification</label>
                
                <div class="captcha-wrapper">
                    <img src="/captcha_image" alt="CAPTCHA" id="captchaImage" style="border-radius: 4px; border: 1px solid #ccc;">
                    <button type="button" class="reload-btn" onclick="refreshCaptcha()" title="Reload Captcha">↻</button>
                </div>

                <input type="text" name="captcha" placeholder="Enter Code Exactly" required autocomplete="off" style="text-align: center; width: 60%; letter-spacing: 2px; font-weight: bold;">
            </div>

            <button type="submit" class="btn-verify">Verify & Register</button>
        </form>
        
        <a href="/cancel" class="cancel-link">Cancel Registration</a>
    </div>

    <script>
        function refreshCaptcha() {
            var img = document.getElementById('captchaImage');
            img.src = '/captcha_image?t=' + new Date().getTime();
        }
    </script>
</body>
</html>
