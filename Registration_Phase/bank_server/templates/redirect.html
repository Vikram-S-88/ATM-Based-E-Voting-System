<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Handshake...</title>
    <style>
        body {
            background-color: #eef2f5;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            text-align: center;
        }

        .redirect-card {
            background: white;
            width: 400px;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 5px solid #0056b3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Modern Spinner */
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0056b3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        h2 {
            margin: 0 0 10px 0;
            color: #0056b3;
            font-size: 20px;
            font-weight: 700;
        }

        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }

        .secure-badge {
            font-size: 12px;
            color: #27ae60;
            background: #e8f5e9;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 15px;
        }

        .manual-link {
            font-size: 12px;
            color: #999;
            text-decoration: none;
            margin-top: 30px;
            border-bottom: 1px dotted #ccc;
        }
        .manual-link:hover { color: #555; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body onload="document.getElementById('bridgeForm').submit()">

    <div class="redirect-card">
        <div class="loader"></div>
        
        <h2>Establishing Handshake...</h2>
        <p>We are securely redirecting you to the <b>Election Commission</b> server to complete your registration.</p>

        <div class="secure-badge">
            <span></span> 256-bit SSL Encrypted
        </div>

        <form id="bridgeForm" action="{{ ec_url }}" method="POST">
            <input type="hidden" name="session_token" value="{{ token }}">
        </form>

        <a href="javascript:document.getElementById('bridgeForm').submit()" class="manual-link">
            Click here if you are not redirected automatically
        </a>
    </div>

</body>
</html>
