<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Bank Login</title>
    <style>
        body {
            background-color: #eef2f5;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .login-card {
            background: white;
            width: 380px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #0056b3;
        }

        .header h2 {
            margin: 0 0 5px 0;
            color: #0056b3;
            font-size: 24px;
        }
        .header p {
            color: #7f8c8d;
            font-size: 14px;
            margin: 0 0 30px 0;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box; 
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #0056b3;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        /* Captcha Styling */
        .captcha-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .captcha-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .captcha-img {
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .reload-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
        }
        .reload-btn:hover { background: #d0d0d0; }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0056b3, #004494);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 86, 179, 0.3);
        }

        .error-banner {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <h2>NetBanking Login</h2>
            <p>Secure Access Gateway</p>
        </div>
        
        {% if error %}
            <div class="error-banner">
                <span></span> {{ error }}
            </div>
        {% endif %}

        <form action="/authenticate" method="POST">
            <div class="input-group">
                <label for="username">User ID</label>
                <input type="text" id="username" name="username" placeholder="Enter User ID" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>
            
            <div class="captcha-box">
                <label style="margin-bottom: 10px;">Security Check</label>
                
                <div class="captcha-wrapper">
                    <img src="/captcha_image" alt="CAPTCHA" class="captcha-img" id="captchaImage">
                    <button type="button" class="reload-btn" onclick="refreshCaptcha()" title="Reload Captcha">↻</button>
                </div>

                <input type="text" name="captcha" placeholder="Enter Code Exactly" required autocomplete="off" style="text-align: center; letter-spacing: 2px; font-weight: bold; width: 80%;">
            </div>

            <button type="submit" class="submit-btn">Secure Login</button>
        </form>
    </div>

    <script>
        function refreshCaptcha() {
            var img = document.getElementById('captchaImage');
            img.src = '/captcha_image?t=' + new Date().getTime();
        }
    </script>
</body>
</html>
